name: Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#2C5364&color_dots=#ebedf0,#b9d7e4,#7fb3c9,#3f7f99,#203A43
            dist/snake-dark.svg?palette=github-dark&color_snake=#58A6FF&color_dots=#161b22,#0f3a4a,#1b5e75,#2c83a0,#58A6FF

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
