<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="1000" height="210" role="img" aria-label="Fear with progress is better than comfort with none.">
  <title>Fear with progress is better than comfort with none.</title>
  <style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
.serif { font-family: Georgia, 'Times New Roman', serif; }
.rise { animation: rise 1.1s cubic-bezier(.2,.8,.2,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.w1 { animation: s1 16s linear infinite; }
.w2 { animation: s2 11s linear infinite; }
.w3 { animation: s3 8s linear infinite; }
@keyframes s1 { to { transform: translateX(-500px); } }
@keyframes s2 { from { transform: translateX(-400px); } to { transform: translateX(0); } }
@keyframes s3 { to { transform: translateX(-600px); } }
.cat { animation: peek 5s ease-in-out infinite; }
@keyframes peek { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
.eyes { transform-box: fill-box; transform-origin: center; animation: wink 4.5s infinite; }
@keyframes wink { 0%, 90%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.1); } }
.ear { transform-box: fill-box; transform-origin: bottom center; animation: twitch 6s infinite; }
@keyframes twitch { 0%, 70%, 80%, 100% { transform: rotate(0); } 74% { transform: rotate(-12deg); } 77% { transform: rotate(4deg); } }
.spark { transform-box: fill-box; transform-origin: center; animation: spark 3s ease-in-out infinite; }
@keyframes spark { 0%, 100% { opacity: 0; transform: scale(.4); } 50% { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .m, .m * { animation: none !important; } .cover { display: none; } }
  </style>
