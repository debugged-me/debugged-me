<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="1000" height="210" role="img" aria-label="Fear with progress is better than comfort with none.">
  <title>Fear with progress is better than comfort with none.</title>
  <style>
text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
.serif { font-family: 'Lyon-Text', Georgia, YuMincho, 'Times New Roman', serif; }
.ink { fill: none; stroke: #37352F; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: ink 1.1s ease-in-out both; }
@keyframes ink { to { stroke-dashoffset: 0; } }
.fade { animation: fade .8s ease-out both; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.caret { animation: blink 1.06s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.breathe { transform-box: fill-box; transform-origin: bottom center; animation: breathe 3.6s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.015, 1.045); } }
.z { animation: z 3.6s ease-out infinite both; }
@keyframes z { 0% { opacity: 0; transform: translate(0, 6px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(10px, -22px); } }
.bar { transform-box: fill-box; transform-origin: top; animation: bar .7s cubic-bezier(.2,.8,.2,1) both; }
@keyframes bar { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .ink { stroke-dashoffset: 0; } .cover { display: none; } }
  </style>
  <rect x=".5" y=".5" width="999" height="209" rx="11.5" fill="#FFFFFF" stroke="#E9E9E7"/>

  <rect class="bar" x="56" y="80" width="3" height="44" fill="#37352F"/>
  <g class="fade" style="animation-delay:.2s">
    <text class="serif" x="80" y="111" font-size="25" fill="#37352F">Fear with progress is better than comfort with none.</text>
  </g>

  <g>
    <path class="ink" pathLength="1" style="animation-delay:0.30s;" d="M780 170 H960"/>
    <g class="breathe">
      <path d="M822 170 C816 142 844 120 880 118 C916 116 944 138 942 170" fill="#FFFFFF"/>
      <path class="ink" pathLength="1" style="animation-delay:0.50s;" d="M822 170 C816 142 844 120 880 118 C916 116 944 138 942 170"/>
      <path class="ink" pathLength="1" style="animation-delay:0.90s;" d="M940 164 C936 178 896 180 866 171"/>
    </g>
    <path d="M806 148 L804 128 L818 138 Z M834 136 L844 122 L846 142 Z" fill="#FFFFFF"/>
    <path class="ink" pathLength="1" style="animation-delay:0.70s;" d="M806 148 L804 128 L818 138"/>
    <path class="ink" pathLength="1" style="animation-delay:0.75s;" d="M834 136 L844 122 L846 142"/>
    <path d="M802 158 C798 140 812 132 826 132 C842 132 850 144 848 158 C846 168 836 171 824 171 C812 171 803 166 802 158 Z" fill="#FFFFFF"/>
    <path class="ink" pathLength="1" style="animation-delay:0.60s;" d="M802 158 C798 140 812 132 826 132 C842 132 850 144 848 158 C846 168 836 171 824 171 C812 171 803 166 802 158 Z"/>
    <path class="ink" pathLength="1" style="animation-delay:1.10s;stroke-width:2" d="M811 152 q4 3.5 8 0 M829 152 q4 3.5 8 0"/>
    <path d="M822 160 h5 l-2.5 3 Z" fill="#37352F" class="fade" style="animation-delay:1.2s"/>
    <g fill="#787774" font-weight="600">
      <text class="z" x="858" y="112" font-size="13">z</text>
      <text class="z" style="animation-delay:1.2s" x="870" y="98" font-size="16">z</text>
      <text class="z" style="animation-delay:2.4s" x="884" y="82" font-size="19">Z</text>
    </g>
  </g>
</svg>
