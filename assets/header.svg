<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="Clark, Software Developer. Web, Mobile, macOS. Mati City, Philippines. Softtech Solution and Services Co.">
  <title>Clark — Software Developer · Web · Mobile · macOS</title>
  <style>
text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
.serif { font-family: 'Lyon-Text', Georgia, YuMincho, 'Times New Roman', serif; }
.ink { fill: none; stroke: #37352F; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: ink 1.1s ease-in-out both; }
@keyframes ink { to { stroke-dashoffset: 0; } }
.fade { animation: fade .8s ease-out both; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.caret { animation: blink 1.06s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.l0 { animation: s0 18.4s infinite; }
@keyframes s0 { 0%, 24.946% { opacity: 1; } 25.000%, 100% { opacity: 0; } }
.t0 { animation: t0 18.4s infinite; }
@keyframes t0 {
  0%, 3.804% { transform: translateX(0); animation-timing-function: steps(52, end); }
  12.500% { transform: translateX(380.7px); }
  21.196% { transform: translateX(380.7px); animation-timing-function: steps(52, end); }
  23.913%, 100% { transform: translateX(0); }
}
.l1 { animation: s1 18.4s infinite; }
@keyframes s1 { 0%, 24.946% { opacity: 0; } 25.000%, 49.946% { opacity: 1; } 50.000%, 100% { opacity: 0; } }
.t1 { animation: t1 18.4s infinite; }
@keyframes t1 {
  0%, 28.804% { transform: translateX(0); animation-timing-function: steps(43, end); }
  37.500% { transform: translateX(350.4px); }
  46.196% { transform: translateX(350.4px); animation-timing-function: steps(43, end); }
  48.913%, 100% { transform: translateX(0); }
}
.l2 { animation: s2 18.4s infinite; }
@keyframes s2 { 0%, 49.946% { opacity: 0; } 50.000%, 74.946% { opacity: 1; } 75.000%, 100% { opacity: 0; } }
.t2 { animation: t2 18.4s infinite; }
@keyframes t2 {
  0%, 53.804% { transform: translateX(0); animation-timing-function: steps(50, end); }
  62.500% { transform: translateX(380.7px); }
  71.196% { transform: translateX(380.7px); animation-timing-function: steps(50, end); }
  73.913%, 100% { transform: translateX(0); }
}
.l3 { animation: s3 18.4s infinite; }
@keyframes s3 { 0%, 74.946% { opacity: 0; } 75.000%, 99.946% { opacity: 1; } 100.000%, 100% { opacity: 0; } }
.t3 { animation: t3 18.4s infinite; }
@keyframes t3 {
  0%, 78.804% { transform: translateX(0); animation-timing-function: steps(46, end); }
  87.500% { transform: translateX(333.4px); }
  96.196% { transform: translateX(333.4px); animation-timing-function: steps(46, end); }
  98.913%, 100% { transform: translateX(0); }
}
.ln { opacity: 0; } .l0 { opacity: 1; }
.ph { animation: ph 4.6s infinite; }
@keyframes ph { 0%, 14% { opacity: 1; } 15%, 95% { opacity: 0; } 96%, 100% { opacity: 1; } }
.float { animation: float 7s ease-in-out infinite; }
.f2 { animation-duration: 9s; animation-delay: -3s; }
.f3 { animation-duration: 8s; animation-delay: -5s; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.eyes { transform-box: fill-box; transform-origin: center; animation: wink 5s infinite; }
@keyframes wink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
.live { transform-box: fill-box; transform-origin: center; animation: live 2.4s ease-out infinite; }
@keyframes live { 0% { opacity: .6; transform: scale(1); } 80%, 100% { opacity: 0; transform: scale(2.6); } }
.code { fill: none; stroke: #9B9A97; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: code 9s infinite both; }
@keyframes code { 0% { stroke-dashoffset: 1; } 8%, 80% { stroke-dashoffset: 0; } 88%, 100% { stroke-dashoffset: 1; } }
.leaf { transform-box: fill-box; transform-origin: bottom center; animation: sway 5s ease-in-out infinite; }
@keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
.steam { fill: none; stroke: #9B9A97; stroke-width: 2; stroke-linecap: round; animation: steam 3.2s ease-in-out infinite; }
@keyframes steam { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .ink { stroke-dashoffset: 0; } .cover { display: none; } }
