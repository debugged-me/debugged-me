<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Clark — Software Developer · Web · Mobile · macOS">
  <title>Clark — Software Developer · Web · Mobile · macOS</title>
  <style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
.blob { transform-box: fill-box; transform-origin: center; animation: drift 18s ease-in-out infinite alternate; }
.b2 { animation-duration: 22s; animation-direction: alternate-reverse; }
.b3 { animation-duration: 26s; }
.b4 { animation-duration: 20s; animation-direction: alternate-reverse; }
@keyframes drift { 0% { transform: translate(0,0) scale(1); } 50% { transform: translate(60px,24px) scale(1.12); } 100% { transform: translate(-40px,-16px) scale(.94); } }
.rise { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
.d1 { animation-delay: .1s; } .d2 { animation-delay: .25s; } .d3 { animation-delay: .4s; } .d4 { animation-delay: .55s; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.pulse { animation: pulse 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 0% { opacity: .55; transform: scale(1); } 80%, 100% { opacity: 0; transform: scale(3); } }
.dot { animation: bob 3s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.float { animation: float 7s ease-in-out infinite; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.caret { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.ln { opacity: 0; } .l0 { opacity: 1; }
.bar { transform-box: fill-box; transform-origin: left center; animation: code 8s infinite both; }
@keyframes code { 0% { transform: scaleX(0); } 6%, 86% { transform: scaleX(1); } 93%, 100% { transform: scaleX(0); } }
.ship { transform-box: fill-box; transform-origin: center; animation: ship 8s infinite both; }
@keyframes ship { 0%, 52% { opacity: 0; transform: translateY(10px) scale(.92); } 58%, 88% { opacity: 1; transform: none; } 94%, 100% { opacity: 0; transform: translateY(6px); } }

.l0 { animation: s0 16.0s infinite; }
@keyframes s0 { 0%, 24.938% { opacity: 1; } 25.000%, 100% { opacity: 0; } }
.t0 { animation: t0 16.0s infinite; }
@keyframes t0 {
  0%, 0.000% { transform: translateX(0); animation-timing-function: steps(52, end); }
  10.625% { transform: translateX(468.0px); }
  20.625% { transform: translateX(468.0px); animation-timing-function: steps(52, end); }
  24.375%, 100% { transform: translateX(0); }
}
.l1 { animation: s1 16.0s infinite; }
@keyframes s1 { 0%, 24.938% { opacity: 0; } 25.000%, 49.938% { opacity: 1; } 50.000%, 100% { opacity: 0; } }
.t1 { animation: t1 16.0s infinite; }
@keyframes t1 {
  0%, 25.000% { transform: translateX(0); animation-timing-function: steps(35, end); }
  35.625% { transform: translateX(315.0px); }
  45.625% { transform: translateX(315.0px); animation-timing-function: steps(35, end); }
  49.375%, 100% { transform: translateX(0); }
}
.l2 { animation: s2 16.0s infinite; }
@keyframes s2 { 0%, 49.938% { opacity: 0; } 50.000%, 74.938% { opacity: 1; } 75.000%, 100% { opacity: 0; } }
.t2 { animation: t2 16.0s infinite; }
@keyframes t2 {
  0%, 50.000% { transform: translateX(0); animation-timing-function: steps(43, end); }
  60.625% { transform: translateX(387.0px); }
  70.625% { transform: translateX(387.0px); animation-timing-function: steps(43, end); }
  74.375%, 100% { transform: translateX(0); }
}
.l3 { animation: s3 16.0s infinite; }
@keyframes s3 { 0%, 74.938% { opacity: 0; } 75.000%, 99.938% { opacity: 1; } 100.000%, 100% { opacity: 0; } }
.t3 { animation: t3 16.0s infinite; }
@keyframes t3 {
  0%, 75.000% { transform: translateX(0); animation-timing-function: steps(46, end); }
  85.625% { transform: translateX(414.0px); }
  95.625% { transform: translateX(414.0px); animation-timing-function: steps(46, end); }
  99.375%, 100% { transform: translateX(0); }
}
@media (prefers-reduced-motion: reduce) { .m, .m * { animation: none !important; } .cover { display: none; } }
  </style>
  <defs>
